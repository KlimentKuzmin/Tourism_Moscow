name: Автовыпуск статьи блога

# Раз в неделю берёт следующий маршрут из content/queue/topics.json,
# пишет по нему статью на двух языках и коммитит её с датой публикации
# через 7 дней. На сайте материал появится сам, когда дата наступит.
on:
  schedule:
    - cron: '0 6 * * 1' # понедельник, 06:00 UTC (09:00 МСК)
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'ID темы из очереди (пусто — следующая по порядку)'
        required: false
      offset_days:
        description: 'Через сколько дней публиковать'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Сгенерировать статью
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/generate-article.mjs \
            ${{ inputs.topic_id && format('--id={0}', inputs.topic_id) || '' }} \
            --offset-days=${{ inputs.offset_days || 7 }}

      - name: Проверить сборку с новой статьёй
        run: |
          node scripts/publish-scheduled.mjs --check
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://tourism-moscow.example' }}

      - name: Закоммитить статью
        run: |
          if git diff --quiet; then
            echo "изменений нет — очередь пуста"
            exit 0
          fi
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add content/
          git commit -m "content: статья «${{ steps.generate.outputs.topic }}» к публикации ${{ steps.generate.outputs.date }}"
          git push
